name: Add or update signing key
description: Request a new key entry or a key source URL change
labels: ["key"]
body:
  - type: input
    attributes:
      label: Vendor / project
      placeholder: e.g., Microsoft, Docker, Tailscale
    validations:
      required: true

  - type: input
    attributes:
      label: Upstream key URL
      placeholder: e.g., https://example.com/repo.gpg
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected fingerprint(s)
      description: Provide the OpenPGP fingerprint(s) you expect (full hex).
      placeholder: |
        ABCD1234...
        0123FEDC...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Notes
      description: Include upstream documentation links or rationale.
    validations:
      required: false
