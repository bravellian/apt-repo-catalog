name: APT Smoke Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      changedRepoIds: ${{ steps.detect.outputs.changedRepoIds }}
      changedReposByOs: ${{ steps.detect.outputs.changedReposByOs }}
      hasRepoChanges: ${{ steps.detect.outputs.hasRepoChanges }}
      removedRepoIds: ${{ steps.detect.outputs.removedRepoIds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/detect-changed-repos.mjs
            node -e 'const fs=require("node:fs");const payload=JSON.parse(fs.readFileSync("reports/changed-repos.json","utf8"));const output=process.env.GITHUB_OUTPUT;fs.appendFileSync(output,"changedRepoIds="+(payload.changedRepoIds||[]).join(",")+"\n");fs.appendFileSync(output,"changedReposByOs="+JSON.stringify(payload.changedReposByOs||{})+"\n");fs.appendFileSync(output,"hasRepoChanges="+payload.hasRepoChanges+"\n");fs.appendFileSync(output,"removedRepoIds="+(payload.removedRepoIds||[]).join(",")+"\n");'
          else
            echo "changedRepoIds=" >> "$GITHUB_OUTPUT"
            echo "changedReposByOs={}" >> "$GITHUB_OUTPUT"
            echo "hasRepoChanges=false" >> "$GITHUB_OUTPUT"
            echo "removedRepoIds=" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: [detect_changes]
    if: github.event_name != 'pull_request' || needs.detect_changes.outputs.hasRepoChanges == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            image: ubuntu:24.04
          - os: ubuntu-22.04
            image: ubuntu:22.04
          - os: generic
            image: ubuntu:24.04
          - os: debian-13
            image: debian:13
          - os: debian-12
            image: debian:12
          - os: debian-11
            image: debian:11
    container:
      image: ${{ matrix.image }}
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates curl gnupg
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
      - run: npm ci
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cat > /tmp/smoke-pr.mjs << 'SCRIPT_EOF'
          const { spawnSync } = require("node:child_process");

          const reposByOs = JSON.parse(process.env.CHANGED_REPOS_BY_OS || "{}");
          const currentOs = process.env.CURRENT_OS;

          const idsForOs = Array.isArray(reposByOs[currentOs])
            ? reposByOs[currentOs]
            : [];
          if (idsForOs.length === 0) {
            console.log("No changes for this OS; skipping.");
            process.exit(0);
          }

          const args = ["node", "scripts/smoke-test-repos.mjs", "--os", currentOs];
          args.push("--only-ids", idsForOs.join(","));

          const result = spawnSync(args[0], args.slice(1), { stdio: "inherit" });
          process.exit(result.status ?? 1);
          SCRIPT_EOF
            node /tmp/smoke-pr.mjs
          else
            node scripts/smoke-test-repos.mjs --os ${{ matrix.os }}
          fi
        env:
          CHANGED_REPOS_BY_OS: ${{ needs.detect_changes.outputs.changedReposByOs }}
          CHANGED_REPO_IDS: ${{ needs.detect_changes.outputs.changedRepoIds }}
          CURRENT_OS: ${{ matrix.os }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.os }}
          path: reports/smoke/${{ matrix.os }}.json

  summarize:
    needs: [smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          function readJson(filePath) {
            return JSON.parse(fs.readFileSync(filePath, "utf8"));
          }

          const reportsDir = path.join(process.cwd(), "reports");
          const entries = fs.readdirSync(reportsDir, { withFileTypes: true });
          const results = [];

          for (const entry of entries) {
            if (!entry.isDirectory() || !entry.name.startsWith("smoke-report-")) {
              continue;
            }
            const reportFiles = fs
              .readdirSync(path.join(reportsDir, entry.name))
              .filter((name) => name.endsWith(".json"));
            for (const reportFile of reportFiles) {
              const fullPath = path.join(reportsDir, entry.name, reportFile);
              results.push(readJson(fullPath));
            }
          }

          const summary = {
            generatedAt: new Date().toISOString(),
            reports: results
          };

          const outDir = path.join(process.cwd(), "reports", "summary");
          fs.mkdirSync(outDir, { recursive: true });
          fs.writeFileSync(
            path.join(outDir, "summary.json"),
            JSON.stringify(summary, null, 2) + "\n"
          );
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-summary
          path: reports/summary/summary.json

  issue_report:
    needs: [summarize]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: reports/smoke
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-latest-report.mjs --inDir reports/smoke --out reports/latest.json
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const title = "Repo smoke test failures (daily)";
            const latestPath = path.join(process.cwd(), "reports", "latest.json");
            const latest = JSON.parse(fs.readFileSync(latestPath, "utf8"));

            const failures = Array.isArray(latest.failures) ? latest.failures : [];
            const totals = latest.totals || { tested: 0, passed: 0, failed: 0, skipped: 0 };
            const failureRows = failures.map(
              (failure) => `- ${failure.os} ${failure.repoId} (${failure.classification || "apt_error"})`
            );

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const generatedAt = latest.generatedAt || new Date().toISOString();

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find((issue) => issue.title === title);

            if (failures.length > 0) {
              const body = [
                `Generated at: ${generatedAt}`,
                `Totals: tested=${totals.tested} passed=${totals.passed} failed=${totals.failed} skipped=${totals.skipped}`,
                "",
                "Failures:",
                ...failureRows,
                "",
                `Run: ${runUrl}`
              ].join("\n");

              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body
                });
              }
              return;
            }

            if (existing) {
              const comment = `All repos passed on ${generatedAt}.`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: comment
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed"
              });
            }

  update_catalog:
    needs: [summarize]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: reports/smoke
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-latest-report.mjs --inDir reports/smoke --out reports/latest.json
      - run: node scripts/generate-catalog-md.mjs
      - run: node scripts/generate-repo-docs.mjs
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/catalog-refresh-${{ github.run_id }}
          title: "chore(catalog): refresh catalog table"
          commit-message: "chore(catalog): refresh catalog table"
          body: |
            ## Summary
            - Refresh CATALOG.md from latest smoke test data.
            - Update reports/latest.json from merged per-OS reports.
            - Regenerate per-repo installation docs.

            ## Reference
            - CATALOG.md
          base: main
          delete-branch: true
          add-paths: |
            CATALOG.md
            reports/latest.json
            docs/README.md
            docs/repos/
          if-no-changes: exit
